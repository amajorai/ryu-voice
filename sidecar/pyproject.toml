[project]
name = "ryu-tts-sidecar"
version = "0.1.0"
description = "Ryu's universal multi-engine TTS sidecar (Core-managed inference runtime)"
requires-python = ">=3.10"
# Base server deps only. Each engine's heavy inference deps are optional extras
# so the base install stays light and a missing engine dep never breaks others.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.24",
    "scipy>=1.10",  # effects chain, resampling, limiter (numpy/scipy DSP fallback)
    "anyio>=4.14.2",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# `pip install -e ".[kokoro]"` etc. — install just the engines you want.
# kokoro is the Ryu default engine (CPU-friendly ONNX runtime, no torch).
kokoro = ["kokoro-onnx>=0.4", "onnxruntime>=1.17", "soundfile>=0.12"]
kitten = ["kittentts"]
pocket = ["pocket-tts"]
# Torch engines (GPU recommended; CPU works). chatterbox-tts 0.1.7 pins
# transformers==5.2.0 and qwen-tts 0.1.1 pins transformers==4.57.3, so the two
# families cannot share one environment; install one of them.
chatterbox = ["chatterbox-tts"]
qwen = ["qwen-tts"]
# True LUFS metering (pyloudnorm, MIT) and in-process FLAC/OGG encoding
# (soundfile). Without them the gated-RMS loudness and ffmpeg encoders are used.
effects = ["pyloudnorm>=0.2", "soundfile>=0.12"]
# Opt-in, GPL-3.0: Spotify's pedalboard for higher-quality reverb, compressor,
# pitch shift, and time-stretch. Never part of `all`; the numpy/scipy DSP is the
# shipped default and is used whenever pedalboard is absent.
pedalboard = ["pedalboard>=0.9"]
all = [
    "kokoro-onnx>=0.4", "onnxruntime>=1.17", "soundfile>=0.12", "kittentts", "pocket-tts",
    "pyloudnorm>=0.2",
]

[project.scripts]
ryu-tts = "ryu_tts.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ryu_tts"]
